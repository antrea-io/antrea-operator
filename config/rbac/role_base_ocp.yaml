apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: antrea-operator
rules:
- apiGroups:
    - coordination.k8s.io
  resources:
    - leases
  verbs:
    - create
    - get
    - update
- apiGroups:
    - config.openshift.io
  resources:
    - clusteroperators
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - config.openshift.io
  resources:
    - clusteroperators/status
  verbs:
    - get
    - patch
    - update
- apiGroups:
    - config.openshift.io
  resources:
    - networks
  verbs:
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - config.openshift.io
  resources:
    - networks/finalizers
  verbs:
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - operator.openshift.io
  resources:
    - networks
  verbs:
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - security.openshift.io
  resources:
    - securitycontextconstraints
  verbs:
    - use
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [flow-aggregator-ca-tls, flow-aggregator-client-tls]
  verbs: [get, list, watch, update, patch, delete]
- apiGroups: [crd.antrea.io]
  resources: [flowexporterdestinations]
  verbs: [create, get, list, watch]
- apiGroups: [crd.antrea.io]
  resources: [flowexporterdestinations]
  resourceNames: [operator-flow-aggregator]
  verbs: [patch, delete]
