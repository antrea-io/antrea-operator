version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - misspell
    - unused
    - staticcheck
    - gosec
    - govet
  settings:
    staticcheck:
      # v1 enabled staticcheck separately from gosimple and stylecheck.
      checks:
        - "SA*"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - antrea.io/antrea-operator
